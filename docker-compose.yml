version: '3.8'

services:
  backend:
    build: ./backend
    container_name: spiritmoov-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./spiritmoov.db
      - SECRET_KEY=dev-secret-key-change-in-production
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
    volumes:
      - ./backend:/app
      - backend-data:/app/data
    networks:
      - spiritmoov-network

  frontend:
    build: ./frontend
    container_name: spiritmoov-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - spiritmoov-network

volumes:
  backend-data:

networks:
  spiritmoov-network:
    driver: bridge
